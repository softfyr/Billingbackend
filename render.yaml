services:
  - type: web
    name: multi-tenant-billing-backend
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multi-tenant-billing-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: multi-tenant-billing-db
    databaseName: multi_tenant_billing
    user: billing_user
